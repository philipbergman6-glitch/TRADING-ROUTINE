# Local Postgres for the ledger. Nothing critical depends on this file:
# the risk-engine tests are pure and always run, and the ledger tests skip
# cleanly when DATABASE_URL is unset.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://trading:trading@localhost:5433/trading pytest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      # 5433 on the host, so this never collides with a locally installed
      # Postgres on the default port.
      - "5433:5432"
    volumes:
      - trading-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  trading-pgdata:
