name: heartbeat

# Did today's routines and workflows actually happen? Emails on any miss,
# including a protection-check delay over the 90-minute service level
# (ADR 0004, measured from the protection-monitor run history). Runs after
# the EOD (~20:15Z) and Friday weekly review (~21:10Z) pushes, and immediately
# whenever a watched workflow fails. GitHub fires the cron 2.7-3.8 h late
# (docs/research/0008), so the workflow_run trigger is the reliable half.
#
# Alert delivery is verified (scripts/email.sh); if the email cannot be sent
# this job fails and, as the channel independent of Resend, opens a GitHub
# issue so the miss is visible in the repository itself.

on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_run:
    workflows: [protection-monitor, dashboard-data, tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # On workflow_run only act on a failure; the scheduled pass covers the rest.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Email immediately on a failed watched workflow
        if: github.event_name == 'workflow_run'
        run: |
          bash scripts/email.sh "WORKFLOW FAILED: ${{ github.event.workflow_run.name }} ($(date -u +%F)) ${{ github.event.workflow_run.html_url }}"
      - name: Daily heartbeat
        if: github.event_name != 'workflow_run'
        run: python3 scripts/heartbeat.py
      - name: Open a GitHub issue when the alert path itself failed
        if: failure()
        run: |
          title="ALERT PATH FAILED $(date -u +%F): heartbeat ${{ github.event_name }}"
          body="Heartbeat run ${{ github.run_id }} failed, so the email alert may not have reached the owner. Read the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
