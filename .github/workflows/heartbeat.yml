name: heartbeat

# Did today's routines and workflows actually happen? Emails on any miss,
# including a protection-check delay over the 90-minute service level
# (ADR 0007, measured from the protection-monitor run history). Runs after
# the EOD (~20:15Z) and Friday weekly review (~21:10Z) pushes, and immediately
# whenever a watched workflow fails. GitHub fires the cron 2.7-3.8 h late
# (docs/research/0008), so the workflow_run trigger is the reliable half.
#
# Alert delivery is verified (scripts/email.sh); if the email cannot be sent
# this job fails and, as the channel independent of Resend, opens a GitHub
# issue so the miss is visible in the repository itself. A miss that WAS
# emailed (heartbeat.py exit 5) leaves the job green: the email is the signal,
# and a red run would only add GitHub's own "Run failed" mail plus a spurious
# ALERT PATH FAILED issue (five of them, #141-#187, 2026-10-12 to 10-16). An
# email sent with a send-only Resend key cannot be verified: that is a warning
# plus one issue a day (scripts/alert_unverified.sh), not a failure (ticket #147).

on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_run:
    workflows: [protection-monitor, dashboard-data, tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # On workflow_run only act on a failure; the scheduled pass covers the rest.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Email immediately on a failed watched workflow
        id: email
        if: github.event_name == 'workflow_run'
        env:
          EMAIL_UNVERIFIED_FILE: ${{ runner.temp }}/email-unverified
        run: |
          bash scripts/email.sh "WORKFLOW FAILED: ${{ github.event.workflow_run.name }} ($(date -u +%F)) ${{ github.event.workflow_run.html_url }}"
      - name: Daily heartbeat
        id: heartbeat
        if: github.event_name != 'workflow_run'
        env:
          EMAIL_UNVERIFIED_FILE: ${{ runner.temp }}/email-unverified
        # Exit 5 = expectations missed and the alert was emailed: green, the
        # email is the signal. 4 = nothing could be assessed, 9 = the alert
        # was not delivered: both stay red. The code is kept for the issue step.
        run: |
          python3 scripts/heartbeat.py && rc=0 || rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -eq 5 ] && exit 0
          exit "$rc"
      - name: Warn once a day when alert delivery could not be verified
        if: always()
        run: bash scripts/alert_unverified.sh "${{ runner.temp }}/email-unverified"
      - name: Open a GitHub issue when the alert path itself failed
        # Exit 4 is "nothing assessed", not a broken alert path; GitHub's own
        # run-failed mail covers it. Anything else red here (exit 9, the
        # workflow_run email step, a step before the script) means the owner
        # may not have been told.
        if: failure() && steps.heartbeat.outputs.exit != '4'
        run: |
          title="ALERT PATH FAILED $(date -u +%F): heartbeat ${{ github.event_name }}"
          body="Heartbeat run ${{ github.run_id }} failed, so the email alert may not have reached the owner. Read the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
