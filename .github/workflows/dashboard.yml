name: dashboard-data

# Triggered by the EOD routine's ~20:10 push to memory/**. No cron here.
# Self-retrigger guard: paths filter excludes docs/**, and the bot commit
# carries [skip ci].
on:
  push:
    branches: [main]
    paths:
      - "memory/**"
      - "scripts/build_dashboard_data.py"
      - "scripts/build_brain_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test deps
        run: pip install pytest

      # Order matters. The build runs first: it is what hard-fails on a bad log
      # (parse mismatch, S&P chain break) and it rewrites data.js. The suite
      # runs after, so the golden test compares against the freshly built file —
      # on an EOD push data.js is *expected* to be stale beforehand.
      - name: Regenerate docs/dashboard/data.js (hard-fails on parse mismatch)
        run: python3 scripts/build_dashboard_data.py

      - name: Regenerate docs/brain/index.json and INDEX.md (hard-fails on parse mismatch)
        run: python3 scripts/build_brain_index.py

      - name: Test (golden + benchmark-chain + paper-only guards)
        run: python3 -m pytest tests/ -q

      # The routine that pushed memory/** pushes its run-record finish line to
      # main seconds later (ADR 0012), so a push built on the triggering commit
      # is rejected as non-fast-forward. Every attempt therefore refetches
      # main, rebuilds data.js on that tip (the build re-reads state/ too) and
      # pushes; a rejection means someone else pushed meanwhile, so try again.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_dashboard_data.py
            python3 scripts/build_brain_index.py
            python3 scripts/build_brain_index.py --check
            if git diff --quiet docs/dashboard/data.js docs/brain/index.json docs/brain/INDEX.md; then
              echo "data.js and brain index unchanged — nothing to publish"
              exit 0
            fi
            git add docs/dashboard/data.js docs/brain/index.json docs/brain/INDEX.md
            git commit -m "dashboard data + brain index: $(date -u +%F) [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt of 5): main moved, rebuilding on its new tip"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish data.js after 5 attempts"
          exit 1
