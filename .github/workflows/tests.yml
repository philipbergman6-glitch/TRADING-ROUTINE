name: tests

# Kept separate from dashboard.yml on purpose: that workflow is a *publish* job
# triggered by the bot's memory commits, with a self-retrigger guard. Mixing a
# test job into it would entangle two unrelated triggers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  risk-engine:
    # The safety tests are pure -- no services, no network, no database. They
    # must never be blocked by infrastructure being unavailable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # On a push to main this job races dashboard.yml, which rebuilds
      # docs/dashboard/data.js and commits it in a follow-up commit, so at the
      # pushed commit the file is legitimately stale. Rebuild first (the build
      # hard-fails on a parse mismatch or S&P chain break), then run the whole
      # offline suite including the golden test. On a PR nothing regenerates
      # the file, so the golden test is a real staleness check there.
      - name: Regenerate dashboard data (push only)
        if: github.event_name == 'push'
        run: python3 scripts/build_dashboard_data.py
      - name: Risk engine + dashboard tests
        run: pytest -v -m "not integration"
      - name: Open experiment segments still match the tree
        run: python3 scripts/segment_record.py --check

  ledger:
    # Real Postgres, not a mock. A ledger tested against a fake proves nothing
    # about the constraints and triggers that do the actual work.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pulled from the public ECR mirror of the Docker official image: the
        # Docker Hub anonymous pull limit failed this job on 2026-10-09.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trading:trading@localhost:5432/trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ledger]"
      - name: Ledger integration tests
        run: pytest -v -m integration --junitxml=ledger-results.xml

      - name: Fail if the ledger tests silently skipped
        # A skipped integration suite passes just as quietly as a green one.
        # This step is what stops "all checks passed" from meaning "nothing ran".
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('ledger-results.xml').findall('.//testcase')
          assert cases, 'No integration tests executed'
          assert not any(c.find('skipped') is not None for c in cases), 'Integration test skipped'
          assert not any(c.find('failure') is not None or c.find('error') is not None for c in cases)
          PY
